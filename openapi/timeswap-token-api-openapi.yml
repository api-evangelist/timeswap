openapi: 3.0.2
info:
  title: Fast FastAPI Token API
  version: 0.1.0
tags:
- name: Token
paths:
  /token/spotPrice:
    get:
      summary: Submit Token
      operationId: submit_token_token_spotPrice_get
      parameters:
      - required: true
        schema:
          title: Chainid
          type: integer
        name: chainId
        in: query
      - required: true
        schema:
          title: Address
          type: string
        name: address
        in: query
      - required: false
        schema:
          title: Refresh
          type: boolean
          default: false
        name: refresh
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Token
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
