openapi: 3.0.2
info:
  title: Fast FastAPI Pools API
  version: 0.1.0
tags:
- name: Pools
paths:
  /pools/tokens/post:
    post:
      summary: Submit Token
      operationId: submit_token_pools_tokens_post_post
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Pools
  /pools/tokens/get:
    get:
      summary: Submit Token
      operationId: submit_token_pools_tokens_get_get
      parameters:
      - required: false
        schema:
          title: Chain Id
          type: integer
          default: 0
        name: chain_id
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Pools
  /pools/pools/post:
    post:
      summary: Submit Pool
      operationId: submit_pool_pools_pools_post_post
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Pools
  /pools/cap:
    get:
      summary: Get Cap
      operationId: get_cap_pools_cap_get
      parameters:
      - required: true
        schema:
          title: Poolid
          type: string
        name: poolId
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Pools
  /pools/pools/get:
    get:
      summary: Get Pool
      operationId: get_pool_pools_pools_get_get
      parameters:
      - required: false
        schema:
          title: Chain Id
          type: integer
          default: 0
        name: chain_id
        in: query
      - required: false
        schema:
          title: Token0 Address
          type: string
          default: 0
        name: token0_address
        in: query
      - required: false
        schema:
          title: Token1 Address
          type: string
          default: 0
        name: token1_address
        in: query
      - required: false
        schema:
          title: Is Prod
          type: boolean
          default: true
        name: is_prod
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Pools
  /pools/pools/update:
    post:
      summary: Update Pool
      operationId: update_pool_pools_pools_update_post
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Pools
  /pools/pools/update/contractsVersion:
    put:
      summary: Update Pool
      operationId: update_pool_pools_pools_update_contractsVersion_put
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Pools
  /pools/tokens/aura-price:
    get:
      summary: Get Price
      operationId: get_price_pools_tokens_aura_price_get
      parameters:
      - required: false
        schema:
          title: Refresh
          type: boolean
          default: false
        name: refresh
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Pools
  /pools/tokens/pendle-price:
    get:
      summary: Pendle Price
      operationId: pendle_price_pools_tokens_pendle_price_get
      parameters:
      - required: false
        schema:
          title: Refresh
          type: boolean
          default: false
        name: refresh
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Pools
  /pools/tokens/pendle-glp-price:
    get:
      summary: Pendle Glp
      operationId: pendle_glp_pools_tokens_pendle_glp_price_get
      parameters:
      - required: false
        schema:
          title: Refresh
          type: boolean
          default: false
        name: refresh
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Pools
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
