openapi: 3.0.2
info:
  title: Fast FastAPI Paulygon API
  version: 0.1.0
tags:
- name: Paulygon
paths:
  /paulygon/test-quest:
    get:
      summary: Getquestdata
      operationId: getQuestData_paulygon_test_quest_get
      parameters:
      - required: false
        schema:
          title: Wallet
          type: string
        name: wallet
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Paulygon
components:
  schemas:
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
