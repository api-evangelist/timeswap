aid: timeswap
name: Timeswap
description: >-
  Timeswap is a decentralized fixed-maturity lending and borrowing protocol
  built by Timeswap Labs. Its AMM lets lenders earn fixed interest, borrowers
  take non-liquidatable loans against any ERC-20 collateral, and liquidity
  providers act as the counterparty, across pools on multiple EVM chains.
  Alongside the on-chain V2 contracts, Timeswap runs a public backend API at
  api.timeswap.io serving pools, caps, tokens, and spot prices to its dApp,
  and publishes TypeScript SDK packages under the @timeswap-labs npm scope.
